services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: safarai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: safarai
      POSTGRES_USER: safarai
      POSTGRES_PASSWORD: safarai
    ports:
      - "5432:5432"
    volumes:
      - safarai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: safarai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - safarai_redis_data:/data

volumes:
  safarai_postgres_data:
  safarai_redis_data:
